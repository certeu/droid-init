title: Filter Out Domain Controllers
description: Filter out events from Domain Controllers
logsource:
    product: windows
    category: process_creation
filter: 
  rules:
    - 7efd2c8d-8b18-45b7-947d-adfe9ed04f61 # points towards rules/sigma/sigmahq/windows/process_creation/proc_creation_win_agentexecutor_potential_abuse.yml
  selection:
    CommandLine|startswith: "SNACK SNACK"
  condition: not selection